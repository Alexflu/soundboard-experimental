name: Refresh dependency lockfiles

on:
  pull_request:
    branches:
      - Main

permissions:
  contents: write

jobs:
  refresh-lockfiles:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'security/dependabot-remediation'
    runs-on: windows-2022

    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: yarn

      - name: Refresh dependency lockfiles within declared ranges
        shell: pwsh
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn upgrade --ignore-scripts --network-timeout 300000
          yarn --cwd src upgrade --ignore-scripts --network-timeout 300000

      - name: Commit refreshed lockfiles
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yarn.lock src/yarn.lock
          if (-not (git diff --cached --quiet)) {
            git commit -m "chore: refresh dependency lockfiles"
            git push origin "HEAD:$env:GITHUB_HEAD_REF"
          }
