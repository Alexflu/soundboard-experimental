name: Align React type packages

on:
  pull_request:
    branches:
      - Main

permissions:
  contents: write

jobs:
  align-types:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'security/dependabot-remediation'
    runs-on: windows-2022

    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: yarn

      - name: Align React 17 type packages
        shell: pwsh
        run: |
          @'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.devDependencies['@types/react'] = '^17.0.0';
          pkg.devDependencies['@types/react-dom'] = '^17.0.0';
          pkg.devDependencies['@types/react-test-renderer'] = '^17.0.0';
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          '@ | node

          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --ignore-scripts --network-timeout 300000

      - name: Commit type alignment
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json yarn.lock
          if (-not (git diff --cached --quiet)) {
            git commit -m "chore: align React 17 type packages"
            git push origin "HEAD:$env:GITHUB_HEAD_REF"
          }
