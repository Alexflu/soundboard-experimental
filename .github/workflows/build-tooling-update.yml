name: Update build tooling

on:
  pull_request:
    branches:
      - Main

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'chore/build-tooling-modernization'
    runs-on: windows-2022

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Activate Yarn
        shell: pwsh
        run: |
          corepack enable
          corepack prepare yarn@4.17.1 --activate
          yarn --version

      - name: Update Babel and Sass configuration
        shell: pwsh
        run: |
          @'
          const fs = require('fs');

          const babelPath = 'babel.config.js';
          let babel = fs.readFileSync(babelPath, 'utf8');
          babel = babel.replace(
            '  return {\n    presets:',
            `  return {\n    assumptions: {\n      setPublicClassFields: true,\n      privateFieldsAsProperties: true,\n    },\n    presets:`
          );
          babel = babel.replace(
            "      [require('@babel/plugin-proposal-class-properties'), { loose: true }],",
            "      require('@babel/plugin-transform-class-properties'),"
          );
          fs.writeFileSync(babelPath, babel);

          const modernSassLoader = `{
            loader: 'sass-loader',
            options: {
              api: 'modern',
            },
          }`;

          const prodPath = '.erb/configs/webpack.config.renderer.prod.babel.mjs';
          let prod = fs.readFileSync(prodPath, 'utf8');
          prod = prod.replace("          'sass-loader'", `          ${modernSassLoader}`);
          fs.writeFileSync(prodPath, prod);

          const rulesPath = '.erb/configs/webpack.config.renderer.rules.mjs';
          let rules = fs.readFileSync(rulesPath, 'utf8');
          rules = rules.replaceAll(
            "      {\n        loader: 'sass-loader',\n      },",
            `      {
                loader: 'sass-loader',
                options: {
                  api: 'modern',
                },
              },`
          );
          fs.writeFileSync(rulesPath, rules);
          '@ | node

      - name: Upgrade build dependencies
        shell: pwsh
        env:
          YARN_ENABLE_SCRIPTS: "false"
        run: |
          yarn remove @babel/plugin-proposal-class-properties
          yarn add -D @babel/plugin-transform-class-properties@latest
          yarn up "@babel/core@latest" "@babel/plugin-transform-runtime@latest" "@babel/preset-env@latest" "@babel/preset-react@latest" "@babel/preset-typescript@latest" "@babel/register@latest" "babel-loader@latest" "sass@latest" "sass-loader@latest" "concurrently@latest" "cross-env@latest" "css-loader@latest" "css-minimizer-webpack-plugin@latest" "mini-css-extract-plugin@latest" "rimraf@latest" "style-loader@latest" "terser-webpack-plugin@latest" "webpack@latest" "webpack-bundle-analyzer@latest" "webpack-cli@latest" "webpack-dev-server@latest" "webpack-merge@latest"

      - name: Commit changes
        shell: pwsh
        run: |
          Remove-Item .github/workflows/build-tooling-update.yml -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json yarn.lock babel.config.js .erb/configs/webpack.config.renderer.prod.babel.mjs .erb/configs/webpack.config.renderer.rules.mjs .github/workflows/build-tooling-update.yml
          git commit --no-verify -m "chore(deps): modernize Babel Sass and build tooling"
          git push origin "HEAD:$env:GITHUB_HEAD_REF"
