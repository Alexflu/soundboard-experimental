name: Apply peer cleanup retry

on:
  pull_request:
    branches:
      - Main

permissions:
  contents: write

jobs:
  update:
    if: github.head_ref == 'chore/peer-dependency-cleanup' && github.actor != 'github-actions[bot]'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/peer-dependency-cleanup
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Activate Yarn
        shell: pwsh
        run: |
          corepack enable
          corepack prepare yarn@4.17.1 --activate
      - name: Update dependencies
        shell: pwsh
        env:
          YARN_ENABLE_SCRIPTS: "false"
        run: |
          yarn remove @types/enzyme @types/enzyme-adapter-react-16 enzyme enzyme-adapter-react-16 enzyme-to-json @typescript-eslint/eslint-plugin @typescript-eslint/parser babel-eslint eslint-config-airbnb eslint-config-airbnb-typescript eslint-config-prettier eslint-plugin-compat eslint-plugin-import eslint-plugin-jest eslint-plugin-jsx-a11y eslint-plugin-prettier eslint-plugin-promise eslint-plugin-react eslint-plugin-react-hooks
          yarn add -D eslint-config-erb@4.1.0 jest@29.7.0 babel-jest@29.7.0 @types/jest@29.5.14 jest-environment-jsdom@29.7.0 prettier@3.6.2 webpack-dev-server@5.2.5
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));delete p.jest.testURL;p.jest.testEnvironment='jsdom';p.jest.testEnvironmentOptions={url:'http://localhost/'};fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          yarn install --immutable
      - name: Commit changes
        shell: pwsh
        run: |
          Get-ChildItem .github/workflows/peer-*.yml -ErrorAction SilentlyContinue | Remove-Item -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit --no-verify -m "chore(deps): clean up peer dependency stack"
          git push origin HEAD:chore/peer-dependency-cleanup
