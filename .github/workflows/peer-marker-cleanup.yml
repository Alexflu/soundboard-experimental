name: Remove peer validation marker

on:
  pull_request:
    branches:
      - Main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'chore/peer-dependency-cleanup' && github.actor != 'github-actions[bot]'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/peer-dependency-cleanup
      - name: Remove temporary files
        shell: pwsh
        run: |
          Remove-Item .github/peer-validation-trigger.txt -Force
          Remove-Item .github/workflows/peer-marker-cleanup.yml -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --no-verify -m "chore: remove temporary validation files"
          git push origin HEAD:chore/peer-dependency-cleanup
