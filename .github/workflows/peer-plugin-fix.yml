name: Align ESLint peer packages

on:
  pull_request:
    branches:
      - Main

permissions:
  contents: write

jobs:
  update:
    if: github.head_ref == 'chore/peer-dependency-cleanup' && github.actor != 'github-actions[bot]'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/peer-dependency-cleanup
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Activate Yarn
        shell: pwsh
        run: |
          corepack enable
          corepack prepare yarn@4.17.1 --activate
      - name: Align ESLint peer packages
        shell: pwsh
        env:
          YARN_ENABLE_SCRIPTS: "false"
        run: |
          yarn add -D eslint@8.49.0 eslint-plugin-compat@4.2.0 eslint-plugin-import@2.28.1 eslint-plugin-jest@27.4.0 eslint-plugin-jsx-a11y@6.7.1 eslint-plugin-prettier@5.0.0 eslint-plugin-promise@6.1.1 eslint-plugin-react@7.33.2 eslint-plugin-react-hooks@4.6.0
          yarn install --immutable
      - name: Commit changes
        shell: pwsh
        run: |
          Remove-Item .github/workflows/peer-plugin-fix.yml -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --no-verify -m "chore(deps): align ESLint peer packages"
          git push origin HEAD:chore/peer-dependency-cleanup
