name: Migrate to Yarn 4

on:
  pull_request:
    branches:
      - Main

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'chore/yarn-4'
    runs-on: windows-2022

    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Prepare migration files
        shell: pwsh
        run: |
          corepack enable
          corepack prepare yarn@4.17.1 --activate

          @'
          const fs = require('fs');

          const root = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          root.packageManager = 'yarn@4.17.1';
          root.scripts.postinstall = root.scripts.postinstall
            .replace(' && yarn-deduplicate yarn.lock', '');
          delete root.devDependencies['yarn-deduplicate'];

          root.resolutions = {
            semver: '7.5.2',
            braces: '3.0.3',
            micromatch: '4.0.8',
            '@tootallnate/once': '2.0.1',
            uuid: '11.1.1',
            '@types/react': '17.0.90',
            '@types/react-dom': '17.0.26',
            '@types/react-test-renderer': '17.0.9'
          };

          fs.writeFileSync('package.json', `${JSON.stringify(root, null, 2)}\n`);

          const app = JSON.parse(fs.readFileSync('src/package.json', 'utf8'));
          app.packageManager = 'yarn@4.17.1';
          fs.writeFileSync('src/package.json', `${JSON.stringify(app, null, 2)}\n`);

          const gitignorePath = '.gitignore';
          let gitignore = fs.readFileSync(gitignorePath, 'utf8');
          if (!gitignore.includes('**/.yarn/install-state.gz')) {
            gitignore += '\n# Yarn Modern\n**/.yarn/install-state.gz\n';
          }
          fs.writeFileSync(gitignorePath, gitignore);
          '@ | node

          @'
          nodeLinker: node-modules
          enableGlobalCache: true
          '@ | Set-Content -Encoding utf8 .yarnrc.yml

      - name: Migrate lockfiles
        id: migrate
        continue-on-error: true
        shell: pwsh
        run: |
          corepack enable
          corepack prepare yarn@4.17.1 --activate
          $env:YARN_ENABLE_SCRIPTS = "false"

          yarn install --no-immutable --mode=skip-build *> root-migration.log
          $rootCode = $LASTEXITCODE
          Get-Content root-migration.log
          if ($rootCode -ne 0) {
            exit $rootCode
          }

          Push-Location src
          yarn install --no-immutable --mode=skip-build *> ../src-migration.log
          $srcCode = $LASTEXITCODE
          Pop-Location
          Get-Content src-migration.log
          exit $srcCode

      - name: Commit Yarn migration
        id: commit
        if: steps.migrate.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          Remove-Item .yarn/install-state.gz, src/.yarn/install-state.gz -Force -ErrorAction SilentlyContinue
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          @'
          root-migration.log
          src-migration.log
          commit.log
          '@ | Add-Content .git/info/exclude

          git status --short *> commit.log
          git add -A *>> commit.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content commit.log
            exit $LASTEXITCODE
          }

          git diff --cached --stat *>> commit.log
          if (git diff --cached --quiet) {
            'No migration changes to commit.' | Add-Content commit.log
            Get-Content commit.log
            exit 0
          }

          git commit --no-verify -m "chore(deps): migrate to Yarn 4.17.1" *>> commit.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content commit.log
            exit $LASTEXITCODE
          }

          git push origin "HEAD:$env:GITHUB_HEAD_REF" *>> commit.log
          $pushCode = $LASTEXITCODE
          Get-Content commit.log
          exit $pushCode

      - name: Upload migration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yarn-migration-output
          path: |
            root-migration.log
            src-migration.log
            commit.log

      - name: Fail on migration errors
        if: steps.migrate.outcome == 'failure' || steps.commit.outcome == 'failure'
        run: exit 1
