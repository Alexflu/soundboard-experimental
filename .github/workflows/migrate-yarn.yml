name: Migrate to Yarn 4

on:
  pull_request:
    branches:
      - Main

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'chore/yarn-4'
    runs-on: windows-2022

    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Prepare migration files
        shell: pwsh
        run: |
          corepack enable
          corepack prepare yarn@4.17.1 --activate

          @'
          const fs = require('fs');

          const root = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          root.packageManager = 'yarn@4.17.1';
          root.scripts.postinstall = root.scripts.postinstall
            .replace(' && yarn-deduplicate yarn.lock', '');
          delete root.devDependencies['yarn-deduplicate'];

          root.resolutions = {
            semver: '7.5.2',
            braces: '3.0.3',
            micromatch: '4.0.8',
            '@tootallnate/once': '2.0.1',
            uuid: '11.1.1',
            '@types/react': '17.0.90',
            '@types/react-dom': '17.0.26',
            '@types/react-test-renderer': '17.0.9'
          };

          fs.writeFileSync('package.json', `${JSON.stringify(root, null, 2)}\n`);

          const app = JSON.parse(fs.readFileSync('src/package.json', 'utf8'));
          app.packageManager = 'yarn@4.17.1';
          fs.writeFileSync('src/package.json', `${JSON.stringify(app, null, 2)}\n`);

          const workflowPath = '.github/workflows/test.yml';
          let workflow = fs.readFileSync(workflowPath, 'utf8');
          workflow = workflow
            .replace('      - name: Install Node.js, NPM and Yarn\n', '      - name: Install Node.js\n')
            .replace('          cache: yarn\n', '')
            .replace(
              '      - name: Install dependencies\n',
              '      - name: Activate Yarn\n' +
                '        shell: pwsh\n' +
                '        run: |\n' +
                '          corepack enable\n' +
                '          corepack prepare yarn@4.17.1 --activate\n' +
                '          yarn --version\n\n' +
                '      - name: Install dependencies\n'
            )
            .replace(
              '          yarn install --frozen-lockfile --ignore-scripts --network-timeout 300000 *> install.log',
              '          $env:YARN_ENABLE_SCRIPTS = "false"\n' +
                '          yarn install --immutable *> install.log'
            )
            .replace(
              '            yarn --cwd src install --frozen-lockfile --ignore-scripts --network-timeout 300000 *>> install.log\n            $code = $LASTEXITCODE',
              '            Push-Location src\n' +
                '            yarn install --immutable *>> ../install.log\n' +
                '            $code = $LASTEXITCODE\n' +
                '            Pop-Location'
            );
          fs.writeFileSync(workflowPath, workflow);

          const gitignorePath = '.gitignore';
          let gitignore = fs.readFileSync(gitignorePath, 'utf8');
          if (!gitignore.includes('.yarn/install-state.gz')) {
            gitignore += '\n# Yarn Modern\n.yarn/install-state.gz\n';
          }
          fs.writeFileSync(gitignorePath, gitignore);
          '@ | node

          @'
          nodeLinker: node-modules
          enableGlobalCache: true
          '@ | Set-Content -Encoding utf8 .yarnrc.yml

      - name: Migrate lockfiles
        id: migrate
        continue-on-error: true
        shell: pwsh
        run: |
          corepack enable
          corepack prepare yarn@4.17.1 --activate
          $env:YARN_ENABLE_SCRIPTS = "false"

          yarn install --no-immutable *> root-migration.log
          $rootCode = $LASTEXITCODE
          Get-Content root-migration.log
          if ($rootCode -ne 0) {
            exit $rootCode
          }

          Push-Location src
          yarn install --no-immutable *> ../src-migration.log
          $srcCode = $LASTEXITCODE
          Pop-Location
          Get-Content src-migration.log
          exit $srcCode

      - name: Upload migration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yarn-migration-output
          path: |
            root-migration.log
            src-migration.log

      - name: Fail on migration errors
        if: steps.migrate.outcome == 'failure'
        run: exit 1

      - name: Commit Yarn migration
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src/package.json yarn.lock src/yarn.lock .yarnrc.yml .gitignore .github/workflows/test.yml
          if (-not (git diff --cached --quiet)) {
            git commit -m "chore(deps): migrate to Yarn 4.17.1"
            git push origin "HEAD:$env:GITHUB_HEAD_REF"
          }
