name: Security audit

on:
  pull_request:
    branches:
      - Main

permissions:
  contents: read
  security-events: read

jobs:
  audit:
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: yarn

      - name: Activate Yarn
        shell: pwsh
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Export Dependabot alerts
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/dependabot/alerts?state=open&per_page=100"
          Invoke-RestMethod -Headers $headers -Uri $uri |
            ConvertTo-Json -Depth 100 |
            Set-Content -Encoding utf8 dependabot-alerts.json

      - name: Run Yarn audit
        shell: pwsh
        run: |
          yarn audit --json *> yarn-audit.json
          exit 0

      - name: List outdated packages
        shell: pwsh
        run: |
          yarn outdated --json *> yarn-outdated.json
          exit 0

      - name: Upload security inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-inventory
          path: |
            dependabot-alerts.json
            yarn-audit.json
            yarn-outdated.json
