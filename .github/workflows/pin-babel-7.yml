name: Align Babel 7

on:
  pull_request:
    branches:
      - Main

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'chore/build-tooling-modernization'
    runs-on: windows-2022

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Activate Yarn
        shell: pwsh
        run: |
          corepack enable
          corepack prepare yarn@4.17.1 --activate

      - name: Align Babel packages
        shell: pwsh
        env:
          YARN_ENABLE_SCRIPTS: "false"
        run: |
          yarn up "@babel/core@^7" "@babel/plugin-transform-class-properties@^7" "@babel/plugin-transform-runtime@^7" "@babel/preset-env@^7" "@babel/preset-react@^7" "@babel/preset-typescript@^7" "@babel/register@^7"

      - name: Commit changes
        shell: pwsh
        run: |
          Remove-Item .github/workflows/pin-babel-7.yml -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json yarn.lock .github/workflows/pin-babel-7.yml
          git commit --no-verify -m "chore(deps): keep Babel on version 7"
          git push origin "HEAD:$env:GITHUB_HEAD_REF"
