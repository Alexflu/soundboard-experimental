name: Apply targeted security upgrades

on:
  pull_request:
    branches:
      - Main

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'security/dependabot-remediation'
    runs-on: windows-2022

    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: yarn

      - name: Update vulnerable dependency roots
        shell: pwsh
        run: |
          @'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));

          pkg.devDependencies['@pmmmwh/react-refresh-webpack-plugin'] = '^0.6.2';
          pkg.devDependencies['react-refresh'] = '^0.18.0';
          pkg.devDependencies['css-minimizer-webpack-plugin'] = '^8.0.0';
          delete pkg.devDependencies['electron-rebuild'];
          pkg.dependencies['electron-updater'] = '^6.8.9';

          pkg.resolutions = {
            ...(pkg.resolutions || {}),
            'eslint-plugin-compat/semver': '7.5.2',
            'jest/**/braces': '3.0.3',
            'babel-jest/**/braces': '3.0.3',
            'jest/**/micromatch': '4.0.8',
            'babel-jest/**/micromatch': '4.0.8',
            'jest/**/@tootallnate/once': '2.0.1',
            'jest/**/uuid': '11.1.1',
            'webpack-dev-server/**/uuid': '11.1.1'
          };

          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          '@ | node

      - name: Regenerate lockfiles
        shell: pwsh
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --ignore-scripts --network-timeout 300000
          yarn --cwd src install --ignore-scripts --network-timeout 300000

      - name: Commit targeted upgrades
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json yarn.lock src/yarn.lock
          if (-not (git diff --cached --quiet)) {
            git commit -m "chore: apply targeted dependency security upgrades"
            git push origin "HEAD:$env:GITHUB_HEAD_REF"
          }
