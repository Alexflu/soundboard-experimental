name: Peer dependency diagnostics

on:
  push:
    branches:
      - chore/peer-dependency-cleanup
  pull_request:
    branches:
      - Main

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event_name == 'push' || github.head_ref == 'chore/peer-dependency-cleanup'
    runs-on: windows-2022

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Activate Yarn
        shell: pwsh
        run: |
          corepack enable
          corepack prepare yarn@4.17.1 --activate

      - name: Install dependencies
        shell: pwsh
        env:
          YARN_ENABLE_SCRIPTS: "false"
        run: yarn install --immutable

      - name: Collect diagnostics
        shell: pwsh
        run: |
          yarn explain peer-requirements *> peer-requirements.txt

          Get-ChildItem -Path . -Recurse -File -Include *.js,*.jsx,*.ts,*.tsx -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\node_modules\\|\\release\\|\\dist\\|\\.git\\' } |
            Select-String -Pattern 'enzyme|enzyme-adapter|eslint-config-erb|extends:\s*["'']erb["'']' |
            ForEach-Object { "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" } |
            Set-Content references.txt

          yarn npm info eslint-config-erb@2.0.0 --json *> eslint-config-erb.json
          yarn npm info enzyme-adapter-react-17-updated --json *> enzyme-react-17.json
          yarn npm info @pmmmwh/react-refresh-webpack-plugin@0.6.2 --json *> react-refresh-plugin.json

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: peer-diagnostics
          path: |
            peer-requirements.txt
            references.txt
            eslint-config-erb.json
            enzyme-react-17.json
            react-refresh-plugin.json
