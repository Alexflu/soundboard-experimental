name: Normalize security update lint

on:
  pull_request:
    branches:
      - Main

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'security/dependabot-remediation'
    runs-on: windows-2022

    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: yarn

      - name: Declare Babel plugin and preserve request error handling
        shell: pwsh
        run: |
          @'
          const fs = require('fs');

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.devDependencies['@babel/plugin-proposal-numeric-separator'] = '^7.18.6';
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);

          const path = 'src/infrastructure/MyInstantSoundAdapter.ts';
          let source = fs.readFileSync(path, 'utf8');
          const target = '        return await fetch(';
          const replacement =
            '        // Await keeps request rejection inside this try/catch.\n' +
            '        // eslint-disable-next-line @typescript-eslint/return-await\n' +
            '        return await fetch(';
          if (!source.includes(target)) {
            throw new Error('Expected MyInstantSoundAdapter return statement was not found');
          }
          source = source.replace(target, replacement);
          fs.writeFileSync(path, source);
          '@ | node

      - name: Install and apply lint fixes
        shell: pwsh
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --ignore-scripts --network-timeout 300000
          yarn lint --fix

      - name: Commit lint normalization
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json yarn.lock src
          if (-not (git diff --cached --quiet)) {
            git commit -m "chore: normalize lint after dependency refresh"
            git push origin "HEAD:$env:GITHUB_HEAD_REF"
          }
