name: Update Node.js engines

on:
  pull_request:
    branches:
      - Main

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'chore/node-24.18.0'
    runs-on: windows-2022

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Update package engines
        shell: pwsh
        run: |
          @'
          const fs = require('fs');
          const packagePath = 'package.json';
          const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          packageJson.engines = {
            node: '>=24.18.0 <25',
            yarn: '>=4.17.1 <5'
          };
          fs.writeFileSync(packagePath, `${JSON.stringify(packageJson, null, 2)}\n`);
          '@ | node

      - name: Commit package update
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit --no-verify -m "chore: require Node.js 24.18.0"
          git push origin "HEAD:$env:GITHUB_HEAD_REF"
