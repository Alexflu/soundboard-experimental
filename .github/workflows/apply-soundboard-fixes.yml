name: Apply soundboard fixes

on:
  push:
    branches:
      - feature/passive-global-hotkeys

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/passive-global-hotkeys

      - name: Apply fixes
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/patch_soundboard.py
          python /tmp/patch_soundboard.py
          npx --yes prettier@2.0.5 --single-quote --write \
            src/application/view/SoundsView.tsx \
            src/infrastructure/LocalSoundAdapter.ts \
            src/application/styles/SoundsView.css

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align durations and improve sound reordering"
          git push origin HEAD:feature/passive-global-hotkeys
