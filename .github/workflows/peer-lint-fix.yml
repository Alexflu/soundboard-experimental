name: Align peer lint configuration

on:
  pull_request:
    branches:
      - Main

permissions:
  contents: write

jobs:
  update:
    if: github.head_ref == 'chore/peer-dependency-cleanup' && github.actor != 'github-actions[bot]'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/peer-dependency-cleanup
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Activate Yarn
        shell: pwsh
        run: |
          corepack enable
          corepack prepare yarn@4.17.1 --activate
      - name: Align lint dependencies and configuration
        shell: pwsh
        env:
          YARN_ENABLE_SCRIPTS: "false"
        run: |
          yarn add -D @typescript-eslint/eslint-plugin@6.7.0 @typescript-eslint/parser@6.7.0

          @'
          module.exports = {
            extends: 'erb',
            rules: {
              // A temporary hack related to IDE not resolving correct package.json
              'import/no-extraneous-dependencies': 'off',
              '@typescript-eslint/ban-ts-comment': 'warn',
              '@typescript-eslint/no-unused-vars': 'warn',
              'no-unused-vars': 'off',
              'no-use-before-define': 'off',
              'max-classes-per-file': 'warn',
              'class-methods-use-this': 'warn',
              'max-len': ['error', { code: 130 }],
              'array-element-newline': ['error', 'consistent'],
              'array-bracket-newline': ['error', 'consistent'],
              'import/extensions': [
                'error',
                'ignorePackages',
                { js: 'never', jsx: 'never', ts: 'never', tsx: 'never' },
              ],
              'react/jsx-filename-extension': [
                'error',
                { extensions: ['.jsx', '.tsx'] },
              ],
              'react/function-component-definition': 'off',
              'lines-between-class-members': [
                'error',
                'always',
                { exceptAfterSingleLine: true },
              ],
            },
            parserOptions: {
              ecmaVersion: 2020,
              sourceType: 'module',
            },
            settings: {
              'import/resolver': {
                // See https://github.com/benmosher/eslint-plugin-import/issues/1396#issuecomment-575727774 for line below
                node: {},
                webpack: {
                  config: require.resolve('./.erb/configs/webpack.config.eslint.js'),
                },
              },
              'import/parsers': {
                '@typescript-eslint/parser': ['.ts', '.tsx'],
              },
            },
            overrides: [
              {
                files: ['src/main.dev.ts'],
                rules: {
                  'import/extensions': 'off',
                  '@typescript-eslint/naming-convention': 'off',
                  'no-underscore-dangle': 'off',
                },
              },
            ],
          };
          '@ | Set-Content .eslintrc.js

          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.prettier.trailingComma='es5';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          yarn install --immutable
      - name: Commit changes
        shell: pwsh
        run: |
          Remove-Item .github/workflows/peer-lint-fix.yml -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --no-verify -m "chore(deps): align lint peer configuration"
          git push origin HEAD:chore/peer-dependency-cleanup
