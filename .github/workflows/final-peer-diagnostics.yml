name: Final peer diagnostics

on:
  pull_request:
    branches:
      - Main

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'chore/peer-dependency-cleanup'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Activate Yarn
        shell: pwsh
        run: |
          corepack enable
          corepack prepare yarn@4.17.1 --activate
      - name: Collect peer diagnostics
        shell: pwsh
        env:
          YARN_ENABLE_SCRIPTS: "false"
        run: |
          yarn install --immutable
          yarn explain peer-requirements *> final-peer-requirements.txt
      - uses: actions/upload-artifact@v4
        with:
          name: final-peer-requirements
          path: final-peer-requirements.txt
