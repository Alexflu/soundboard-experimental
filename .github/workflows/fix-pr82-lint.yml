name: Fix PR 82 lint

on:
  push:
    branches:
      - feature/audio-output-master-volume

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/audio-output-master-volume

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 300000

      - name: Fix lint
        run: yarn eslint src/application/component/ChooseAudioOutput.tsx src/application/component/SoundComponent.tsx src/domain/SoundboardDomain.ts --fix

      - name: Commit fixes
        run: |
          rm .github/workflows/fix-pr82-lint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: fix audio output lint"
          git push origin HEAD:feature/audio-output-master-volume
