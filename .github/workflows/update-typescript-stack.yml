name: Update TypeScript stack

on:
  pull_request:
    branches:
      - Main

permissions:
  contents: write

jobs:
  update-and-validate:
    if: github.head_ref == 'agent/modernize-typescript-stack'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0

      - name: Activate Yarn
        shell: pwsh
        run: corepack enable

      - name: Install dependencies
        shell: pwsh
        run: |
          $env:YARN_ENABLE_IMMUTABLE_INSTALLS = 'false'
          yarn install

      - name: Lint
        shell: pwsh
        run: yarn lint

      - name: Type check
        id: typecheck
        continue-on-error: true
        shell: pwsh
        run: |
          yarn exec tsc --noEmit *>&1 | Tee-Object -FilePath typescript-typecheck.log
          exit $LASTEXITCODE

      - name: Commit type-check diagnostics
        if: always()
        shell: pwsh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f typescript-typecheck.log
          if (-not (git diff --cached --quiet)) {
            git commit -m "ci: capture TypeScript diagnostics"
            git push
          }

      - name: Stop after type-check failure
        if: steps.typecheck.outcome == 'failure'
        shell: pwsh
        run: exit 1

      - name: Test
        shell: pwsh
        run: yarn test --runInBand

      - name: Package
        shell: pwsh
        run: yarn package
