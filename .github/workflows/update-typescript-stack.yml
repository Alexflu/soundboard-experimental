name: Update TypeScript stack

on:
  pull_request:
    branches:
      - Main

permissions:
  contents: write

jobs:
  update-and-validate:
    if: github.head_ref == 'agent/modernize-typescript-stack'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0

      - name: Activate Yarn
        shell: pwsh
        run: corepack enable

      - name: Install dependencies
        shell: pwsh
        run: |
          $env:YARN_ENABLE_IMMUTABLE_INSTALLS = 'false'
          yarn install
          node node_modules/electron/install.js

      - name: Lint
        shell: pwsh
        run: yarn lint

      - name: Type check
        shell: pwsh
        run: yarn exec tsc --noEmit

      - name: Test
        shell: pwsh
        run: yarn test --runInBand

      - name: Package
        shell: pwsh
        run: yarn package
