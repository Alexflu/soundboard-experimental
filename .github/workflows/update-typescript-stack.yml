name: Update TypeScript stack

on:
  pull_request:
    branches:
      - Main

permissions:
  contents: write

jobs:
  update-and-validate:
    if: github.head_ref == 'agent/modernize-typescript-stack'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0

      - name: Activate Yarn
        shell: pwsh
        run: corepack enable

      - name: Install dependencies
        shell: pwsh
        run: |
          $env:YARN_ENABLE_IMMUTABLE_INSTALLS = 'false'
          yarn install

      - name: Lint
        shell: pwsh
        run: yarn lint

      - name: Type check
        shell: pwsh
        run: yarn exec tsc --noEmit

      - name: Test
        id: test
        continue-on-error: true
        shell: pwsh
        run: |
          yarn test --runInBand *>&1 | Tee-Object -FilePath typescript-test.log
          exit $LASTEXITCODE

      - name: Commit test diagnostics
        if: always()
        shell: pwsh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f typescript-test.log
          if (-not (git diff --cached --quiet)) {
            git commit -m "ci: capture TypeScript test diagnostics"
            git push
          }

      - name: Stop after test failure
        if: steps.test.outcome == 'failure'
        shell: pwsh
        run: exit 1

      - name: Package
        shell: pwsh
        run: yarn package
