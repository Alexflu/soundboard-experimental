name: Test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - Main
  push:
    branches:
      - Main

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-2022]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Activate Yarn
        shell: pwsh
        run: |
          corepack enable
          corepack prepare yarn@4.17.1 --activate
          yarn --version

      - name: Install dependencies
        id: install
        continue-on-error: true
        shell: pwsh
        run: |
          $env:YARN_ENABLE_SCRIPTS = "false"
          yarn install --immutable --mode=skip-build *> install.log
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            node node_modules/electron/install.js *>> install.log
            $code = $LASTEXITCODE
          }
          if ($code -eq 0) {
            Push-Location src
            yarn install --immutable --mode=skip-build *>> ../install.log
            $code = $LASTEXITCODE
            Pop-Location
          }
          Get-Content install.log
          exit $code

      - name: Upload install diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-output
          path: install.log

      - name: Fail on install errors
        if: steps.install.outcome == 'failure'
        run: exit 1

      - name: Lint
        id: lint
        continue-on-error: true
        shell: pwsh
        run: |
          yarn lint *> lint.log
          $code = $LASTEXITCODE
          Get-Content lint.log
          exit $code

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-output
          path: lint.log

      - name: Fail on lint errors
        if: steps.lint.outcome == 'failure'
        run: exit 1

      - name: Type check
        id: typecheck
        continue-on-error: true
        shell: pwsh
        run: |
          yarn exec tsc --noEmit *> typecheck.log
          $code = $LASTEXITCODE
          Get-Content typecheck.log
          exit $code

      - name: Upload type-check diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-output
          path: typecheck.log

      - name: Fail on type-check errors
        if: steps.typecheck.outcome == 'failure'
        run: exit 1

      - name: Test
        run: yarn test --runInBand

      - name: Package app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn package
