name: Test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - Main
  push:
    branches:
      - Main

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: yarn

      - name: Install dependencies
        id: install
        continue-on-error: true
        shell: pwsh
        run: |
          yarn install --frozen-lockfile --ignore-scripts --network-timeout 300000 *> install.log
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            node node_modules/electron/install.js *>> install.log
            $code = $LASTEXITCODE
          }
          if ($code -eq 0) {
            yarn --cwd src install --frozen-lockfile --ignore-scripts --network-timeout 300000 *>> install.log
            $code = $LASTEXITCODE
          }
          Get-Content install.log
          exit $code

      - name: Upload install diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-output
          path: install.log

      - name: Fail on install errors
        if: steps.install.outcome == 'failure'
        run: exit 1

      - name: Lint
        id: lint
        continue-on-error: true
        shell: pwsh
        run: |
          yarn lint *> lint.log
          $code = $LASTEXITCODE
          Get-Content lint.log
          exit $code

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-output
          path: lint.log

      - name: Fail on lint errors
        if: steps.lint.outcome == 'failure'
        run: exit 1

      - name: Type check
        id: typecheck
        continue-on-error: true
        shell: pwsh
        run: |
          npx --yes -p typescript@4.9.5 tsc --noEmit *> typecheck.log
          $code = $LASTEXITCODE
          Get-Content typecheck.log
          exit $code

      - name: Upload type-check diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-output
          path: typecheck.log

      - name: Fail on type-check errors
        if: steps.typecheck.outcome == 'failure'
        run: exit 1

      - name: Test
        run: yarn test --runInBand

      - name: Package app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn package
