name: Test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - Main
  push:
    branches:
      - Main

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: yarn

      - name: yarn install
        shell: pwsh
        run: |
          yarn install --frozen-lockfile --network-timeout 300000 *> install.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content install.log
            exit $LASTEXITCODE
          }

      - name: Lint
        id: lint
        continue-on-error: true
        shell: pwsh
        run: |
          yarn lint *> lint.log
          exit $LASTEXITCODE

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-output
          path: lint.log

      - name: Fail on lint errors
        if: steps.lint.outcome == 'failure'
        run: exit 1

      - name: Type check
        run: yarn tsc --noEmit

      - name: Test
        run: yarn test --runInBand

      - name: Package app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn package