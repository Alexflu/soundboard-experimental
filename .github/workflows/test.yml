name: Test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - Main
  push:
    branches:
      - Main

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: yarn

      - name: yarn install
        shell: pwsh
        run: |
          yarn install --frozen-lockfile --network-timeout 300000 *> install.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content install.log
            exit $LASTEXITCODE
          }

      - name: Apply ESLint fixes
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          yarn eslint . --fix --cache --ext .js,.jsx,.ts,.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "style: apply eslint fixes"
            git push origin HEAD:${{ github.head_ref }}
          }
          exit 0

      - name: Lint
        id: lint
        continue-on-error: true
        shell: pwsh
        run: |
          yarn lint *> lint.log
          exit $LASTEXITCODE

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-output
          path: lint.log

      - name: Fail on lint errors
        if: steps.lint.outcome == 'failure'
        run: exit 1

      - name: Type check
        run: yarn tsc --noEmit

      - name: Test
        run: yarn test --runInBand

      - name: Package app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn package