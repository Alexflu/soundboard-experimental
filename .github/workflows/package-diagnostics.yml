name: Package diagnostics

on:
  pull_request:
    branches:
      - Main

jobs:
  diagnose:
    if: github.head_ref == 'chore/build-tooling-modernization'
    runs-on: windows-2022

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Activate Yarn
        shell: pwsh
        run: |
          corepack enable
          corepack prepare yarn@4.17.1 --activate

      - name: Install dependencies
        shell: pwsh
        run: |
          $env:YARN_ENABLE_SCRIPTS = "false"
          yarn install --immutable --mode=skip-build
          node node_modules/electron/install.js
          Push-Location src
          yarn install --immutable --mode=skip-build
          Pop-Location

      - name: Package with diagnostics
        id: package
        continue-on-error: true
        shell: pwsh
        env:
          NODE_OPTIONS: --trace-deprecation
        run: |
          yarn package *> package.log
          $code = $LASTEXITCODE
          Get-Content package.log
          exit $code

      - name: Upload package diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-diagnostics
          path: package.log

      - name: Fail on package errors
        if: steps.package.outcome == 'failure'
        run: exit 1
