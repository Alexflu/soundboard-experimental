<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' http://localhost:*; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; font-src 'self' data:; media-src 'self' file: blob: https:; connect-src 'self' http://localhost:* ws://localhost:* https://www.myinstants.com; object-src 'none'; base-uri 'self'"
    />
    <title>Soundboard</title>
    <script>
      (() => {
        if (process?.env?.NODE_ENV !== 'development') {
          const link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = './dist/style.css';
          document.getElementsByTagName('head')[0].appendChild(link);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const port = process.env.PORT || 1212;
      const script =
        process.env.NODE_ENV === 'development'
          ? `http://localhost:${port}/dist/renderer.dev.js`
          : './dist/renderer.prod.js';

      document.write(`<script defer src="${script}"><\/script>`);
    </script>
  </body>
</html>
