approvedGitRepositories:
  - "**"

enableGlobalCache: true

nodeLinker: node-modules

npmMinimalAgeGate: 0

# Supply peer metadata omitted by transitive tooling packages.
packageExtensions:
  "@typescript-eslint/utils@*":
    peerDependencies:
      typescript: "*"
  "eslint-config-erb@4.1.0":
    peerDependencies:
      prettier: "*"
      typescript: "*"
  "dmg-builder@*":
    peerDependencies:
      electron-builder-squirrel-windows: "*"
    peerDependenciesMeta:
      electron-builder-squirrel-windows:
        optional: true
  "electron-builder@*":
    peerDependencies:
      electron-builder-squirrel-windows: "*"
    peerDependenciesMeta:
      electron-builder-squirrel-windows:
        optional: true
